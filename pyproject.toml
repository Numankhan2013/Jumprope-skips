[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jumprope-counter"
version = "0.1.0"
description = "Count jump-rope skips in a video and estimate calories burned"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "opencv-python>=4.8", "matplotlib>=3.7"]

[project.optional-dependencies]
pose = ["mediapipe>=0.10.14"]
test = ["pytest"]

[project.scripts]
jumprope-counter = "jumprope_counter.cli:main"

[tool.setuptools]
packages = ["jumprope_counter"]
